# MathForge — Docker Compose
version: '3.9'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mathforge-backend
    ports:
      - "8000:8000"
    environment:
      - MATHFORGE_ENV=production
      - MATHFORGE_HOST=0.0.0.0
      - MATHFORGE_PORT=8000
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql://mathforge:mathforge@postgres:5432/mathforge
    depends_on:
      - redis
      - postgres
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mathforge-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: mathforge-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: mathforge-postgres
    environment:
      POSTGRES_USER: mathforge
      POSTGRES_PASSWORD: mathforge
      POSTGRES_DB: mathforge
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mathforge-worker
    command: celery -A app.worker worker --loglevel=info
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql://mathforge:mathforge@postgres:5432/mathforge
    depends_on:
      - redis
      - postgres
    restart: unless-stopped

volumes:
  postgres_data:
